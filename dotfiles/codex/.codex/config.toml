BROWSER_USE_CODEX_APP_VERSION = "26.803.41515"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

# Launch via bash so $HOME expands (tilde is not expanded by process spawn APIs).
