# The shared Codex settings. Each machine's real ~/.codex/config.toml adds what Codex writes
# itself (project trust, hook trust) and lives in the private overlay, so copy this file there
# (or to ~/.codex/config.toml) to start one.
# ChatGPT OAuth account default. Do not pin model_provider.
model_reasoning_effort = "medium"
personality = "pragmatic"
web_search = "cached"
approvals_reviewer = "user"
approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "default"
suppress_unstable_features_warning = true
model = "gpt-6.1-sol"

[features]
apps = true
browser_use = true
browser_use_external = true
computer_use = true
enable_request_compression = true
fast_mode = true
goals = true
guardian_approval = true
hooks = true
image_generation = true
in_app_browser = true
multi_agent = true
personality = true
plugin_sharing = true
plugins = true
prevent_idle_sleep = true
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true
terminal_resize_reflow = true
tool_call_mcp_elicitation = true
tool_suggest = true
unified_exec = true
workspace_dependencies = true
js_repl = false

[tui]
animations = true
notification_condition = "always"
notification_method = "auto"
notifications = true
status_line_use_colors = true
# Same order as agent-statusline (Claude Code, Grok, pi); Codex only takes built-in items.
status_line = ["model-with-reasoning", "context-used", "current-dir", "git-branch", "fast-mode", "run-state"]
terminal_title = [
  "project",
  "thread-name",
]
vim_mode_default = false

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 30

# Portable launcher expands $HOME (see bin/node-repl-mcp.sh). No /Users/<name>.
[mcp_servers.node_repl]
command = "/bin/bash"
args = ["-lc", "exec \"$HOME/.codex/bin/node-repl-mcp.sh\""]
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "323bc3e687e17d7e377238d9f4c69111c4d0e6219103b6316d8c52082489533b"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.803.41515"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

# Launch via bash so $HOME expands (tilde is not expanded by process spawn APIs).
[mcp_servers.computer-use]
command = "/bin/bash"
args = [
  "-lc",
  "exec \"$HOME/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient\" mcp",
]
enabled = true
startup_timeout_sec = 60

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[desktop]
keepRemoteControlAwakeWhilePluggedIn = true

[desktop.open-in-target-preferences]
global = "cursor"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 900

[model_providers.cli_proxy]
name = "CLIProxyAPI"
base_url = "https://cli-proxy.dataplanelabs.com/v1"
wire_api = "responses"
supports_websockets = true
env_key = "CLI_PROXY_API_KEY"
env_key_instructions = "Export CLI_PROXY_API_KEY from gopass: gopass show -o personal/saas/cli-proxy/code-01-api-key"

[shell_environment_policy.set]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "323bc3e687e17d7e377238d9f4c69111c4d0e6219103b6316d8c52082489533b"
NODE_REPL_TRUSTED_CODE_PATHS = ".:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
# base_url is sourced from CLI_PROXY_BASE_URL (https://cli-proxy.dataplanelabs.com) — keep in sync with env var

[model_providers.cliproxyapi]
name = "CLIProxyAPI"
base_url = "https://cli-proxy.dataplanelabs.com/v1"
wire_api = "responses"
supports_websockets = true
env_key = "CLI_PROXY_API_KEY"
env_key_instructions = "Export CLI_PROXY_API_KEY from gopass: gopass show -o personal/saas/cli-proxy/code-01-api-key"

[mcp_servers.jump-cli]
command = "jump-cli"
args = ["mcp"]

[mcp_servers.browseros-neo]
url = "http://127.0.0.1:9010/mcp"

# BEGIN OPENRIG MANAGED CODEX CONFIG FRAGMENT: shared:codex-default-config
[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
