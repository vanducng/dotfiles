onboarding = false

[theme]
name = "tokyo-night"

auto_switch = false
[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+x"
reload_config = "prefix+shift+r"
resize_mode = "prefix+r"
next_workspace = "prefix+shift+right"
switch_workspace = "ctrl+alt+1..9"
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
focus_agent = "prefix+alt+1..9"
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"
previous_tab = "prefix+p"
switch_tab = "ctrl+1..9"
rename_pane = ""
cycle_pane_next = ""
last_pane = "prefix+a"
split_vertical = "prefix+m"
split_horizontal = "prefix+v"

[[keys.command]]
key = "prefix+space"
type = "pane"
command = "herdr-fingers"
description = "pick recent path"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "herdr-agents"
description = "focus agent by address"

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "herdr-pane-rename"
description = "rename pane from project context"

[[keys.command]]
key = "prefix+shift+g"
type = "shell"
command = "gh repo view --web"
description = "open current GitHub repository"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-tab-renumber"
description = "renumber tabs 1-based"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1
