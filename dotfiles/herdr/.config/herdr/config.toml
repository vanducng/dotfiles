onboarding = false

[theme]
name = "tokyo-night"

auto_switch = false
[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+x"
reload_config = "prefix+shift+r"
resize_mode = "prefix+r"
goto = ["prefix+g", "prefix+shift+m"]
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
switch_workspace = ["prefix+shift+1..9", "ctrl+alt+1..9"]
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
focus_agent = "prefix+alt+1..9"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
previous_tab = "prefix+p"
switch_tab = ["prefix+1..9", "ctrl+1..9"]
rename_pane = ""
last_pane = "prefix+a"
split_vertical = "prefix+m"
split_horizontal = "prefix+v"

[[keys.command]]
key = "prefix+0"
type = "shell"
command = "herdr-home"
description = "focus first pane on this machine"

[[keys.command]]
key = "prefix+space"
type = "pane"
command = "herdr-fingers"
description = "pick recent path"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "herdr-agents"
description = "focus agent by address"

[[keys.command]]
key = "prefix+,"
type = "shell"
command = "herdr-pane-rename"
description = "rename pane from session context"

[[keys.command]]
key = "prefix+shift+g"
type = "shell"
command = "gh pr view --web 2>/dev/null || gh pr list --web"
description = "open current pull request or pull request list"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-tab-renumber"
description = "renumber tabs 1-based"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true
tab_bar_position = "bottom"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[experimental]
allow_nested = true
switch_ascii_input_source_in_prefix = true
pane_history = true
