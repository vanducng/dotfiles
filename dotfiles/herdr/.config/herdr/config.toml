onboarding = false

[theme]
name = "catppuccin"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+x"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
switch_workspace = "prefix+shift+1..9"
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
focus_agent = "prefix+alt+1..9"
previous_tab = ["prefix+p", "prefix+space"]
cycle_pane_next = ""
last_pane = "prefix+a"
split_vertical = "prefix+m"
split_horizontal = "prefix+v"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "droid"
description = "start Droid"

[[keys.command]]
key = "prefix+tab"
type = "pane"
command = "herdr-fingers"
description = "pick recent path"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "herdr-agents"
description = "focus agent by address"

[ui]
agent_panel_scope = "all"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1
