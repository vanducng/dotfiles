# Out-of-tree omdsh plugins. Bare names resolve beside this file, so the
# packages come from $DSH_HOME/omdsh/node_modules (managed by package.json
# in this directory).
#
# dsh-observe exports session telemetry to Langfuse over the storage
# facility the omdsh base composition provides. It stays inert unless
# LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are present in the environment
# (the same credentials pi-langfuse uses, exported from ~/.envrc via direnv).

- id: dsh-observe
  name: dsh-observe
  config:
    enabled: !!js "Boolean(process.env.LANGFUSE_PUBLIC_KEY && process.env.LANGFUSE_SECRET_KEY)"
    langfuse: !!js "process.env.LANGFUSE_PUBLIC_KEY && process.env.LANGFUSE_SECRET_KEY ? { baseUrl: process.env.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com', publicKey: process.env.LANGFUSE_PUBLIC_KEY, secretKey: process.env.LANGFUSE_SECRET_KEY, release: (process.env.OMDSH_VERSION ? 'omdsh@' + process.env.OMDSH_VERSION : (function(){ try { const fs = process.getBuiltinModule('fs'); const path = process.getBuiltinModule('path'); const bin = fs.realpathSync(process.argv[1] || ''); const pkg = path.join(path.dirname(bin), '..', 'package.json'); const v = JSON.parse(fs.readFileSync(pkg, 'utf8')).version; return typeof v === 'string' && v ? 'omdsh@' + v : 'omdsh'; } catch { return 'omdsh'; } })()) } : null"
