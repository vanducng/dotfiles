[cli]
auto_update = true
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[models]
default = "grok-4.7"
web_search = "grok-4.7"

[ui]
permission_mode = "always-approve"
max_thoughts_width = 120
fork_secondary_model = "grok-4.7"
yolo = false
compact_mode = false
simple_mode = true
vim_mode = true
show_thinking_blocks = true
group_tool_verbs = true
collapsed_edit_blocks = false
page_flip_on_send = true
remember_tool_approvals = true
default_selected_permission = "always_allow_all_sessions"

[ui.status_line]
type = "command"
command = "~/.local/bin/agent-statusline"

[features]
telemetry = false
feedback = true
lsp_tools = false
codebase_indexing = true
two_pass_compaction = false
remote_fetch = true

[session]
auto_compact_threshold_percent = 85
load_envrc = true

[tools]
respect_gitignore = false

[toolset.bash]
timeout_secs = 600.0
output_byte_limit = 20000

[subagents]
enabled = true

[workflows]
enabled = true

[skills]
paths = ["~/skills"]
ignore = []
disabled = []
server_skill_dirs = []
bundled_skill_dirs = []

[compat.claude]
skills = true
rules = true
agents = true
mcps = true
hooks = false
sessions = true

[compat.cursor]
skills = true
rules = true
agents = true
mcps = true
hooks = false
sessions = true

[compat.codex]
sessions = true

[mcp_servers.miudb]
command = "miudb"
args = [
    "mcp",
    "serve",
    "--transport",
    "stdio",
]
enabled = true
startup_timeout_sec = 30

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]
enabled = true
startup_timeout_sec = 60
