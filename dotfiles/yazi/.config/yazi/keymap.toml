[[mgr.prepend_keymap]]
on   = [ "g", "e" ]
run  = "cd ~/git/personal"
desc = "personal"

[[mgr.prepend_keymap]]
on   = [ "g", "x" ]
run  = "cd ~/git/work/acme"
desc = "acme"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/git/work/umbrella"
desc = "umbrella"

[[mgr.prepend_keymap]]
on   = [ "g", "g" ]
run  = "cd ~/git/work/initech"
desc = "initech"

[[mgr.prepend_keymap]]
on  = [ "T" ]
run = "plugin --sync max-preview"

[[mgr.prepend_keymap]]
on  = [ "T" ]
run = "plugin --sync hide-preview"

[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin bookmarks-persistence --args=save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "g" ]
run = "plugin bookmarks-persistence --args=jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin bookmarks-persistence --args=delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin bookmarks-persistence --args=delete_all"
desc = "Delete all bookmarks"
