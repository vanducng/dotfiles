# Home machines: the same names on every machine (Included from ~/.ssh/config).
# HostName is the Tailscale IPv4 so it works on the LAN and away from home;
# linux-01 runs Tailscale with --accept-dns=false, so MagicDNS names do not resolve there.
# Names follow <kind>-<nn> (mbp, mini, linux); old names (macpro, mac01, linux01, dpl, ...) stay as aliases.

Host mini-01 mac01
  HostName 100.91.133.36
  User dplmac01

Host linux-01 linux01 linux01-ts dpl dpl-ts
  HostName 100.111.142.22
  User ubuntu
  Port 2222

Host mbp-01 macpro
  HostName 100.85.72.60
  User vanducng

# LAN fallbacks for when Tailscale is down.
Host mini-01-lan mac01-lan
  HostName 192.168.1.21
  User dplmac01

Host linux-01-lan
  HostName 192.168.1.193
  User ubuntu
  Port 2222

# Chrome CDP (9222) and RDP (13389 -> 3389) forwards to linux-01: ssh -N linux-01-tunnel
Host linux-01-tunnel linux01-tunnel linux01-ts-tunnel dpl-tunnel dpl-ts-tunnel
  HostName 100.111.142.22
  User ubuntu
  Port 2222
  ExitOnForwardFailure yes
  ControlMaster auto
  ControlPersist 10m
  ControlPath ~/.ssh/cm-%n-%p-%r
  LocalForward 127.0.0.1:9222 127.0.0.1:9222
  LocalForward 127.0.0.1:13389 127.0.0.1:3389

Host mini-01 mac01 mini-01-lan mac01-lan linux-01 linux01 linux01-ts dpl dpl-ts linux-01-lan linux-01-tunnel linux01-tunnel linux01-ts-tunnel dpl-tunnel dpl-ts-tunnel mbp-01 macpro
  IdentitiesOnly yes
  ServerAliveInterval 30
  ServerAliveCountMax 3
