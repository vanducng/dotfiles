# meh+<letter> app keys (mirror of macOS skhd meh layer). meh = ctrl+alt+shift.
# Format: shortcut,command,wm_class,title   (wm_class /regex/ allowed)
<Ctrl><Alt><Shift>a,ghostty,com.mitchellh.ghostty,
<Ctrl><Alt><Shift>s,browseros-neo,browseros-neo,
# Skip the fullscreen Grafana wall (CDP Chrome, separate profile) when raising Chrome.
<Ctrl><Alt><Shift>d,google-chrome,google-chrome,/^(?!.*Grafana)/
<Ctrl><Alt><Shift>v,grok-bot,grok-bot,
<Ctrl><Alt><Shift>z,firefox,/firefox/i,
<Ctrl><Alt><Shift>g,cursor,/cursor/i,
<Ctrl><Alt><Shift>k,slack,/slack/i,
<Ctrl><Alt><Shift>f,kitty --class sysmon -o remember_window_size=no -o initial_window_width=160c -o initial_window_height=45c sysmon hub,sysmon,
<Ctrl><Alt><Shift>w,libreoffice,/libreoffice/i,
<Ctrl><Alt><Shift>p,evince,org.gnome.Evince,
<Ctrl><Alt><Shift>o,eog,org.gnome.eog,
<Ctrl><Alt><Shift>q,rhythmbox,org.gnome.Rhythmbox3,
