# Linux: GNOME has no yabai, so keep the title bar to drag/move windows.
window-decoration = auto

# Over Jump, Mac cmd+c/v arrive as ctrl+c/v. Copy only with a selection, so ctrl+c still interrupts.
keybind = performable:ctrl+c=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard
# In case Jump sends cmd as super instead.
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard
