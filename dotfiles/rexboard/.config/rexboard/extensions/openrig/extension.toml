name = "openrig"
contract = 1
description = "OpenRig seats: each seat's project and rig, a message to the seat, and OpenRig's state for a seat that reports nothing"
cmd = ["./adapter"]
every = 10
timeout = 5

[[fields]]
name = "project"
title = "PROJECT"

[[fields]]
name = "rig"
title = "RIG"

[[fields]]
name = "session"
title = "SESSION"
hidden = true

[[actions]]
name = "send"
title = "Send message"
key = "s"
cmd = ["./send", "{host}", "{field:session}", "{text}"]
confirm = "send to {field:session} on {host}"
when = ["session"]
timeout = 45  # send waits up to wait_for_idle (at most 30 s, see send), then verifies delivery

[provides]
status = true
