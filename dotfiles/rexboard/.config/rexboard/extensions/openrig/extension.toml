name = "openrig"
contract = 1
description = "OpenRig seats: each seat's rig, project and role, a message to the seat, and OpenRig's state for a seat that reports nothing"
cmd = ["./adapter"]
every = 10
timeout = 5

[[fields]]
name = "rig"
title = "RIG"

[[fields]]
name = "project"
title = "PROJECT"

[[fields]]
name = "role"
title = "ROLE"

[[fields]]
name = "session"
title = "SESSION"
hidden = true

[[actions]]
name = "send"
title = "Send message"
key = "s"
cmd = ["./send", "{host}", "{field:session}", "{text}"]
confirm = "send to {field:session} on {host}: {text}"
when = ["session"]
timeout = 20

[provides]
status = true
